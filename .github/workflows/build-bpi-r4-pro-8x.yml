# Builds the BPI-R4 Pro 8X with ./build.sh bpi-r4-pro-8x <variant>.
name: Build BPI-R4 Pro 8X

on:
  schedule:
    # 每周一北京时间早上 04:00 自动运行（UTC 时间每周日 20:00）
    # 如需每天运行，可改为 '0 20 * * *'
    - cron: '0 20 * * 0'
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant'
        required: true
        default: 'Pro-8X-wifi'
        type: choice
        options:
          - Pro-8X-wifi
          - Pro-8X-wired
      use_latest_upstream:
        description: 'Auto-fetch latest OpenWrt & MTK commits (override pins.conf)'
        required: false
        default: true
        type: boolean
      repo_commit:
        description: 'Commit hash of this repository (leave empty for latest)'
        required: false
        default: ''
      openwrt_commit:
        description: 'Manual OpenWrt commit hash (overrides auto-fetch)'
        required: false
        default: ''
      mtk_commit:
        description: 'Manual MTK SDK commit hash (overrides auto-fetch)'
        required: false
        default: ''
      publish:
        description: 'Publish to the release tags (unchecked: images only as a workflow artifact)'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.repo_commit || github.sha }}

      - name: Load build versions
        run: |
          # 1. 先加载默认 pins.conf 作为兜底
          grep -v '^\s*#' pins.conf | grep -v '^\s*$' >> $GITHUB_ENV

          # 2. 如果是定时自动运行，或者手动勾选了 use_latest_upstream，则自动获取上游最新 Commit
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.use_latest_upstream }}" = "true" ]; then
            echo "Fetching latest upstream commits..."
            LATEST_OPENWRT=$(git ls-remote https://openwrt.org refs/heads/openwrt-25.12 | cut -f1)
            LATEST_MTK=$(git ls-remote https://mediatek.com refs/heads/master | cut -f1)
            LATEST_MT76=$(git ls-remote https://github.com HEAD | cut -f1)
            LATEST_MAC80211=$(git ls-remote https://github.com HEAD | cut -f1)
            LATEST_HOSTAPD=$(git ls-remote https://github.com HEAD | cut -f1)
            LATEST_IW=$(git ls-remote https://github.com HEAD | cut -f1)
            LATEST_WIFI_SCRIPTS=$(git ls-remote https://github.com HEAD | cut -f1)

            [ -n "$LATEST_OPENWRT" ] && echo "OPENWRT_COMMIT=$LATEST_OPENWRT" >> $GITHUB_ENV
            [ -n "$LATEST_MTK" ] && echo "MTK_COMMIT=$LATEST_MTK" >> $GITHUB_ENV
            [ -n "$LATEST_MT76" ] && echo "SOFTMAC_MT76=$LATEST_MT76" >> $GITHUB_ENV
            [ -n "$LATEST_MAC80211" ] && echo "SOFTMAC_MAC80211=$LATEST_MAC80211" >> $GITHUB_ENV
            [ -n "$LATEST_HOSTAPD" ] && echo "SOFTMAC_HOSTAPD=$LATEST_HOSTAPD" >> $GITHUB_ENV
            [ -n "$LATEST_IW" ] && echo "SOFTMAC_IW=$LATEST_IW" >> $GITHUB_ENV
            [ -n "$LATEST_WIFI_SCRIPTS" ] && echo "SOFTMAC_WIFI_SCRIPTS=$LATEST_WIFI_SCRIPTS" >> $GITHUB_ENV
          fi

          # 3. 如果手动填写了指定 Commit，则以手动填写的为准
          [ -n "${{ github.event.inputs.openwrt_commit }}" ] && echo "OPENWRT_COMMIT=${{ github.event.inputs.openwrt_commit }}" >> $GITHUB_ENV || true
          [ -n "${{ github.event.inputs.mtk_commit }}" ] && echo "MTK_COMMIT=${{ github.event.inputs.mtk_commit }}" >> $GITHUB_ENV || true

      - name: Set build variables
        run: |
          # 定时任务触发时 inputs.variant 为空，默认使用 Pro-8X-wifi
          VARIANT="${{ github.event.inputs.variant || 'Pro-8X-wifi' }}"
          echo "EFFECTIVE_VARIANT=$VARIANT" >> $GITHUB_ENV

          if [ "$VARIANT" = "Pro-8X-wifi" ]; then
            echo "BOARD_VARIANT=standard" >> $GITHUB_ENV
            echo "RELEASE_TAGS=release-pro-8x-standard" >> $GITHUB_ENV
          else
            echo "BOARD_VARIANT=wired" >> $GITHUB_ENV
            echo "RELEASE_TAGS=release-pro-8x-wired" >> $GITHUB_ENV
          fi

      - name: Runner hardware
        run: |
          nproc; lscpu | grep -E 'Model name|^CPU\(s\)'; free -g | head -2

      - name: Free disk space on runner
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext libncurses-dev libssl-dev python3-distutils python3-setuptools \
            rsync swig unzip zlib1g-dev file wget libelf-dev ccache git

      - name: Build
        run: ./build.sh bpi-r4-pro-8x "$BOARD_VARIANT"

      - name: Prepare release artifacts
        run: |
          FILOGIC="openwrt/bin/targets/mediatek/filogic"

          mkdir -p rel-pro
          cp "${FILOGIC}/openwrt-mediatek-filogic-bananapi_bpi-r4-pro-8x-squashfs-sysupgrade.itb" rel-pro/bpi-r4-pro-8x.itb
          cp "${FILOGIC}/openwrt-mediatek-filogic-bananapi_bpi-r4-pro-8x-nvme-img.bin"            rel-pro/
          cp "${FILOGIC}/openwrt-mediatek-filogic-bananapi_bpi-r4-pro-8x-sdcard.img.gz"           rel-pro/
          cp "${FILOGIC}/openwrt-mediatek-filogic-bananapi_bpi-r4-pro-8x-emmc-img.bin"            rel-pro/
          cp "${FILOGIC}/openwrt-mediatek-filogic-bananapi_bpi-r4-pro-8x-snand-img.bin"           rel-pro/
          cp "${FILOGIC}/config.buildinfo"                                                          rel-pro/
          cp boards/bpi-r4-pro-8x/unifi/unifi-setup.sh                                                                  rel-pro/
          cp boards/bpi-r4-pro-8x/unifi/rc.local                                                                        rel-pro/
          cp boards/bpi-r4-pro-8x/unifi/rc-network.sh                                                                   rel-pro/
          cp boards/bpi-r4-pro-8x/unifi/unifi-network-setup-8gb.sh                                                      rel-pro/unifi-network-setup.sh
          cd rel-pro
          sha256sum bpi-r4-pro-8x.itb \
            openwrt-mediatek-filogic-bananapi_bpi-r4-pro-8x-nvme-img.bin \
            openwrt-mediatek-filogic-bananapi_bpi-r4-pro-8x-sdcard.img.gz \
            openwrt-mediatek-filogic-bananapi_bpi-r4-pro-8x-emmc-img.bin \
            openwrt-mediatek-filogic-bananapi_bpi-r4-pro-8x-snand-img.bin > sha256sums
          cd ..

      - name: Upload images as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: images-bpi-r4-pro-8x-${{ env.EFFECTIVE_VARIANT }}
          path: |
            rel-pro/*.itb
            rel-pro/openwrt-*-sdcard.img.gz
            rel-pro/config.buildinfo
          if-no-files-found: error
          retention-days: 14

      - name: Publish release-pro-8x-standard
        if: (github.event_name == 'schedule' || github.event.inputs.publish == 'true') && (env.EFFECTIVE_VARIANT == 'Pro-8X-wifi')
        run: |
          gh release delete release-pro-8x-standard --yes --cleanup-tag 2>/dev/null || true
          gh release create release-pro-8x-standard rel-pro/* \
            --title "BPI-R4 Pro 8X standard WiFi (latest)" \
            --notes "Variant: standard (WiFi + wifimgr) | RAM: 8GB | BPI-R4 Pro 8X | Commit: ${{ github.event.inputs.repo_commit || github.sha }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release-pro-8x-wired
        if: (github.event_name == 'schedule' || github.event.inputs.publish == 'true') && (env.EFFECTIVE_VARIANT == 'Pro-8X-wired')
        run: |
          gh release delete release-pro-8x-wired --yes --cleanup-tag 2>/dev/null || true
          gh release create release-pro-8x-wired rel-pro/* \
            --title "BPI-R4 Pro 8X wired (latest)" \
            --notes "Variant: wired (no wifimgr) | RAM: 8GB | BPI-R4 Pro 8X | Commit: ${{ github.event.inputs.repo_commit || github.sha }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
